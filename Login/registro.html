<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles-login.css">
    <link rel="stylesheet" href="grid.css">
    <link rel="stylesheet" href="query.css">
    <title>Registro</title>
</head>

<body>
    <main>
        <section class="contenedor-registro">
            <div class="contenedor cont1">
                <h2>
                    Registro
                </h2>
            </div>
            <div class="contenedor cont2">
                <h1>LingoWeb</h1>
                <p>Aprende Inglés, Alemán y Chino gratis y de forma divertida</p>
            </div>
            <div class="contenedor cont11">
                <form action="login.html">
                    <div class="usuario">
                        <label for="usuario">Usuario:</label>
                        <input type="text" id="usuario" name="usuario" required>
                    </div>

                    <div class="usuario">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="usuario">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" name="telefono" pattern="[0-9]{10}" required>
                    </div>

                    <div class="usuario">
                        <label for="contraseña">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="usuario">
                        <label for="contraseña">Confirmar contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                        <button type="submit">Iniciar Sesión</button>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
