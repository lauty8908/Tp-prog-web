<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles-login.css">
    <link rel="stylesheet" href="grid.css">
    <link rel="stylesheet" href="query.css">
    <title>Login</title>
</head>

<body>
    <main>
        <section class="contenedor-login">
            <div class="contenedor cont1">
                <h2>
                    ¡BIENVENIDO!
                </h2>
            </div>
            <div class="contenedor cont2">
                <h1>LingoWeb</h1>
                <p>Aprende Inglés, Alemán y Chino gratis y de forma divertida</p>
            </div>
            <div class="contenedor cont3">
                <form action="tp/EleccionCurso/index.html">
                    <div class="usuario">
                        <label for="usuario">Usuario / E-mail:</label>
                        <input type="text" id="usuario" name="usuario" required>
                    </div>

                    <div class="usuario">
                        <label for="contraseña">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button>Iniciar Sesión</button>
                </form>
            </div>
            <div class="contenedor cont5">
                <a href="contra.html">¿Olvidaste tu contraseña?</a> |
                <a href="registro.html">Registrarse</a>
            </div>
        </section>
    </main>
</body>

</html>
