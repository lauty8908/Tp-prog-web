<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección Interactiva - Aleman</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="grid.css">
</head>

<body>
    <header>
        <nav>
            <h1>LingoWeb</h1>
            <a href="" class="link">Cursos</a>
            <a href="" class="link">Perfil</a>
            <a href="" class="link">Ranking</a>
            <p>🔥 5 Dias | ⚡ 350 XP </p>
        </nav>
    </header>
    <main>
        <form action="" class="contenedor">
            <div class="contenedor-v">
                <a href="../index.html" class="btn-cerrar">X</a>
                <div class="barra-progreso">
                    <progress max="100" value="60"></progress>
                    <span>60%</span>
                </div>
                <p>| ❤️❤️❤️ Vidas: 3 </p>
            </div>
            <div class="contenedor-pregunta">
                <h2>Traduce la siguiente oración:</h2>
                <p>Wann öffnet das Museum morgen?🔊</p>
                <input type="text" class="input-resp" pattern="[¿]?[Aa] qu[eé] hora abre el museo mañan[a]\??"
                    placeholder="Escribe tu respuesta aqui.." required>
            </div>
            <div class="contenedor-palabra">
                <h2>Banco de palabras disponibles.</h2>
                <p>[¿A] [qué] [hora] [abre] [el] [museo] [mañana?] [cuándo] [cierra] [la] [tienda] [ayer?]
                </p>
            </div>
            <div class="contenedor-comprobar">
                <button type="submit" class="btn-comprobar">Comprobar respuestas</button>
            </div>
        </form>

    </main>
    <footer>
        <p>Derechos reservados.</p>
    </footer>
</body>

</html>
